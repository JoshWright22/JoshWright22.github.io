  <rect class="bg" width="860" height="470"/>
  <rect width="860" height="6" fill="#d4147a"/>
  
  <text x="380" y="27" class="g">3 agents · 1 GPU · 1 human</text>

  <g class="l l0"><text x="22" y="62"><tspan class="p">claude ›</tspan><tspan class="w"> firefighter run --gpu --minutes 40 --vram 10 -- python train.py</tspan></text></g>
  <g class="l l1"><text x="22" y="86"><tspan class="k">◆ nanoGPT train: spotlight's yours</tspan><tspan class="g"> (lease 40 min, budget left 212.0)</tspan></text></g>
  <g class="l l2"><text x="22" y="118"><tspan class="p">codex  ›</tspan><tspan class="w"> firefighter run --gpu --minutes 15 -- python eval.py</tspan></text></g>
  <g class="l l3"><text x="22" y="142"><tspan class="y">◆ evals [main set] waiting in the wings #1, on ~14:06</tspan><tspan class="g">: GPU turn queue</tspan></text></g>
  <g class="l l4"><text x="22" y="164"><tspan class="g">   market: x1.40 · busy 15m 80% · bid 3 ~22m cost 9 · bid 7 ~6m cost 21 · best: bid 3</tspan></text></g>
  <g class="l l5"><text x="22" y="196"><tspan class="p">gemini ›</tspan><tspan class="w"> python render.py   </tspan><tspan class="g"># skipped firefighter…</tspan></text></g>
  <g class="l l6"><text x="22" y="220"><tspan class="o">   adopted: python.exe (started by gemini) → spot band, charged, preempted first</tspan></text></g>
  <g class="l l7"><text x="22" y="252"><tspan class="w">     you  › </tspan><tspan class="k">launch a game 🎮</tspan></text></g>
  <g class="l l8"><text x="22" y="276"><tspan class="k">   human: on stage (game)</tspan><tspan class="g"> reserve → 8 CPUs · 15% RAM · 4 GB VRAM, within 0.5 s</tspan></text></g>
  <g class="l l9"><text x="22" y="300"><tspan class="y">   nanoGPT train: paused at a step boundary</tspan><tspan class="g"> (cooperative pause file)</tspan></text></g>
  <g class="l l10"><text x="22" y="332"><tspan class="w">     you  › </tspan><tspan class="g">quit the game</tspan></text></g>
  <g class="l l11"><text x="22" y="356"><tspan class="y">   nanoGPT train: resumed</tspan><tspan class="g"> · reserve gives back 1 CPU / 15 s</tspan></text></g>
  <g class="l l12"><text x="22" y="388"><tspan class="k">◆ nanoGPT train: curtain call, ok (exit 0) in 37.2 min</tspan><tspan class="g"> (declared 40), charged 31.4</tspan></text></g>
  <g class="l l13"><text x="22" y="412"><tspan class="k">◆ evals: spotlight's yours</tspan><tspan class="g"> (lease 15 min, price locked x0.9)</tspan></text></g>

name: Rebuild agent pages
on:
  push:
    branches: [main]
    paths: [script.js, tools/build-agent-pages.mjs]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/build-agent-pages.mjs
      - run: |
          git config user.name "Josh Wright"
          git config user.email "awsomebash22@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild agent pages" && git push)

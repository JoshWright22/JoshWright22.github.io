    <!-- Preloader: counts up, then wipes away -->
    <div class="loader" id="loader">
        <div class="loader-inner">
            <span class="loader-label">Josh Wright / Portfolio</span>
            <span class="loader-count" id="loader-count">000</span>
        </div>
        <div class="loader-bar"><span id="loader-fill"></span></div>

    <!-- Runs before the rest of the page parses, so the ball never waits on it -->
    <script>
        (() => {
            const loader = document.getElementById('loader');
            const count = document.getElementById('loader-count');
            const fill = document.getElementById('loader-fill');

            if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
                window.siteLoader = {
                    finish(done) {
                        loader.remove();
                        done();
                    }
                };
                return;
            }

            document.body.classList.add('loading');

            const ball = document.createElement('span');
            ball.className = 'loader-ball';
            loader.append(ball);

            const HANG = 460;
            const HEIGHT = Math.min(innerHeight * 0.32, 260);
            const SIZE = 44;
            const HOLD = 92;
            let n = 0;
            let onDone = null;
            let finished = false;
            let run = null;
            let ticker = 0;

            // The number only changes when the ball lands on it. It holds short
            // of 100 until the page is really ready.
            function land() {
                if (finished) return;
                const room = onDone ? 100 : HOLD;
                n = Math.min(room, n + Math.random() * 10 + 11);
                const v = Math.floor(n);
                count.textContent = String(v).padStart(3, '0');
                fill.style.width = v + '%';
                count.classList.remove('hit');
                void count.offsetWidth;
                count.classList.add('hit');

                if (n < 100) return;
                finished = true;
                clearInterval(ticker);
                if (run) run.cancel();
                ball.remove();
                setTimeout(() => {
                    loader.classList.add('done');
                    document.body.classList.remove('loading');
                    onDone();
                    setTimeout(() => loader.remove(), 1200);
                }, 320);
            }

            // The bounce runs as one looping animation the browser plays by itself, so
            // the page setting itself up underneath can't make the ball stutter. One loop
            // is three hops, last digit to first, first to second, second to last: a curve
            // from one digit to the next, quick off the number, a long hang, quick back in.
            function animate() {
                const box = count.getBoundingClientRect();
                const digitX = i => box.left + box.width * (i + 0.5) / 3 - SIZE / 2;
                const STEPS = 24;
                const points = [];
                [[2, 0], [0, 1], [1, 2]].forEach(([a, b], hop) => {
                    for (let i = 0; i < STEPS; i++) {
                        const t = i / STEPS;
                        const edge = Math.abs(2 * t - 1);
                        points.push({
                            offset: (hop + t) / 3,
                            x: digitX(a) + (digitX(b) - digitX(a)) * t,
                            y: box.top + box.height * 0.08 - SIZE - (1 - edge ** 3) * HEIGHT
                        });
                    }
                });
                points.push({ ...points[0], offset: 1 });
                // The stretch follows the ball's real direction of travel, at a frame's worth of it.
                const perFrame = (1000 / 60) / (HANG / STEPS);
                const frames = points.map((p, i) => {
                    const prev = points[(i - 1 + points.length - 1) % (points.length - 1)];
                    const dx = (p.x - prev.x) * perFrame;
                    const dy = (p.y - prev.y) * perFrame;
                    const stretch = Math.min(0.3, Math.hypot(dx, dy) / 90);
                    const angle = Math.atan2(dy, dx);
                    return { offset: p.offset, transform: `translate(${p.x}px, ${p.y}px) rotate(${angle}rad) scale(${1 + stretch}, ${1 - stretch * 0.6})` };
                });
                const at = run ? run.currentTime : 0;
                if (run) run.cancel();
                run = ball.animate(frames, { duration: HANG * 3, iterations: Infinity });
                run.currentTime = at;
            }

            animate();
            // Landings are read off the ball itself, so the number can't drift away from it
            // while the page is busy setting itself up.
            let landed = 0;
            ticker = setInterval(() => {
                const hops = Math.floor(run.currentTime / HANG);
                if (hops > landed) {
                    landed = hops;
                    land();
                }
            }, 8);
            // The number's box moves once its font arrives, and with the window.
            addEventListener('resize', () => finished || animate());
            if (document.fonts) document.fonts.ready.then(() => finished || animate());

            window.siteLoader = {
                finish(done) {
                    onDone = done;
                }
            };
        })();
    </script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Wright - Software Developer</title>
    <meta name="description"
        content="Josh Wright is a software developer and computer science student. I build web apps, games, tools, and the systems that hold them together.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="icon" type="image/jpeg" href="assets/me.jpg">
</head>

<body>

    <!-- Preloader: counts up, then wipes away -->
    <div class="loader" id="loader">
        <div class="loader-inner">
            <span class="loader-label">Josh Wright / Portfolio</span>
            <span class="loader-count" id="loader-count">000</span>
        </div>
        <div class="loader-bar"><span id="loader-fill"></span></div>
    </div>

    <header class="nav" id="nav">
        <a href="#top" class="nav-logo">JW<span class="nav-star">✳</span></a>
        <nav class="nav-links">
            <a href="#about" data-nav>About</a>
            <a href="#work" data-nav>Work</a>
            <a href="#stack" data-nav>Stack</a>
            <a href="#contact" data-nav>Contact</a>
        </nav>
        <div class="nav-status">
            <span class="status-dot"></span>
            <span id="nav-clock">--:--:--</span>
        </div>
    </header>

    <main id="top">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-top">
                <span class="mono muted">Portfolio / 2026</span>
                <span class="mono muted">Tempe, Arizona</span>
            </div>

            <div class="hero-main">
                <h1 class="hero-title" id="hero-title">
                    <span class="line"><span class="line-in">Josh</span></span>
                    <span class="line"><span class="line-in">Wright</span></span>
                </h1>

                <figure class="hero-portrait">
                    <div class="hero-portrait-mask">
                        <img src="assets/me-about.jpg" alt="Josh Wright" data-lightbox="assets/me-about.jpg"
                            data-lightbox-label="Josh Wright">
                    </div>
                    <figcaption class="mono muted">Software Developer<br>&amp; Systems Engineer</figcaption>
                </figure>
            </div>
        </section>

        <!-- MARQUEE -->
        <div class="marquee" aria-hidden="true">
            <div class="marquee-track" id="marquee-track"></div>
        </div>

        <!-- ABOUT -->
        <section class="section" id="about">
            <div class="section-head">
                <span class="mono index">01</span>
                <span class="mono label">About</span>
            </div>

            <div class="about">
                <div class="about-media">
                    <img id="profile-img" src="assets/me-hero.jpg" alt="Josh Wright" loading="lazy">
                    <span class="mono muted caption">Josh Wright / ASU Computer Science</span>
                </div>
                <div class="about-body">
                    <h2 class="about-heading" id="about-heading" data-reveal></h2>
                    <p class="about-text" id="about-text" data-reveal></p>
                    <div class="link-list" id="primary-links-container"></div>
                </div>
            </div>
        </section>

        <!-- WORK -->
        <section class="section section--flush" id="work">
            <div class="section-head">
                <span class="mono index">02</span>
                <span class="mono label">Selected Work</span>
                <span class="mono muted count" id="work-count"></span>
            </div>
            <div id="projects-container"></div>
        </section>

        <!-- STACK -->
        <section class="section" id="stack">
            <div class="section-head">
                <span class="mono index">03</span>
                <span class="mono label">Stack &amp; Expertise</span>
            </div>
            <div class="stack" id="stack-tags"></div>
        </section>

    </main>

    <!-- CONTACT / FOOTER -->
    <footer class="footer" id="contact">
        <div class="section-head">
            <span class="mono index">04</span>
            <span class="mono label">Contact</span>
        </div>

        <div class="footer-cta">
            <span class="line"><span class="line-in">Let's</span></span>
            <span class="line"><span class="line-in">work</span></span>
            <span class="line"><span class="line-in">together</span></span>
        </div>

        <div class="footer-grid">
            <div>
                <span class="mono muted">Email</span>
                <a class="footer-link" href="mailto:joshwright0322@gmail.com">joshwright0322@gmail.com</a>
            </div>
            <div>
                <span class="mono muted">Elsewhere</span>
                <div class="footer-socials" id="footer-socials"></div>
            </div>
            <div>
                <span class="mono muted">Local time</span>
                <span class="footer-link" id="footer-clock">--:--:--</span>
            </div>
        </div>
    </footer>

    <script src="script.js?v=4"></script>
</body>

</html>

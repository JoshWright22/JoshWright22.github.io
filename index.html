    <!-- Preloader: counts up, then wipes away -->
    <div class="loader" id="loader">
        <div class="loader-inner">
            <span class="loader-label">Josh Wright / Portfolio</span>
            <span class="loader-count" id="loader-count">000</span>
        </div>
        <div class="loader-bar"><span id="loader-fill"></span></div>
    </div>

    <!-- Runs before the rest of the page parses, so the ball never waits on it -->
    <script>
        (() => {
            const loader = document.getElementById('loader');
            const count = document.getElementById('loader-count');
            const fill = document.getElementById('loader-fill');

            if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
                window.siteLoader = {
                    finish(done) {
                        loader.remove();
                        done();
                    }
                };
                return;
            }

            document.body.classList.add('loading');

            const ball = document.createElement('span');
            ball.className = 'loader-ball';
            loader.append(ball);

            const HANG = 460;
            const HEIGHT = Math.min(innerHeight * 0.32, 260);
            const SIZE = 44;
            const HOLD = 92;
            let n = 0;
            let hits = 0;
            let lastHit = performance.now();
            let onDone = null;
            let last = null;

            // The number only changes when the ball lands on it. It holds short
            // of 100 until the page is really ready.
            function land(now) {
                const room = onDone ? 100 : HOLD;
                n = Math.min(room, n + Math.random() * 10 + 11);
                const v = Math.floor(n);
                count.textContent = String(v).padStart(3, '0');
                fill.style.width = v + '%';
                count.classList.remove('hit');
                void count.offsetWidth;
                count.classList.add('hit');
                hits++;
                lastHit = now;

                if (n < 100) return;
                ball.remove();
                setTimeout(() => {
                    loader.classList.add('done');
                    document.body.classList.remove('loading');
                    onDone();
                    setTimeout(() => loader.remove(), 1200);
                }, 320);
            }

            function bounce(now) {
                const box = count.getBoundingClientRect();
                const ms = now - lastHit;
                const t = Math.min(1, ms / HANG);

                // A curve from one digit to the next: quick off the number, a long
                // hang, then quick back into it.
                const digitX = i => box.left + box.width * (i + 0.5) / 3 - SIZE / 2;
                const from = digitX((hits + 2) % 3);
                const to = digitX(hits % 3);
                const edge = Math.abs(2 * t - 1);
                const x = from + (to - from) * t;
                const y = box.top + box.height * 0.08 - SIZE - (1 - edge ** 3) * HEIGHT;

                // The stretch follows the ball's real direction of travel.
                const dx = last ? x - last.x : 0;
                const dy = last ? y - last.y : 0;
                const moved = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                const stretch = Math.min(0.3, moved / 90);
                ball.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad) scale(${1 + stretch}, ${1 - stretch * 0.6})`;

                last = { x, y };

                if (ms >= HANG) land(now);
                if (n < 100) requestAnimationFrame(bounce);
            }

            requestAnimationFrame(bounce);

            window.siteLoader = {
                finish(done) {
                    onDone = done;
                }
            };
        })();
    </script>
